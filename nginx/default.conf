# 로그인 무차별 대입 방지: IP당 분당 10회 (conf.d 파일은 http 컨텍스트에 include 됨)
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;

server {
    listen       80;
    server_name  _;

    # AI 발주서 업로드는 최대 30MB 허용 → 여유 포함 35MB (기본 1MB면 413 발생)
    client_max_body_size 35m;

    server_tokens off;

    # 압축 (프록시된 응답 포함)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain application/xml;

    # 보안 헤더
    # 주의: location 안에서 add_header 를 쓰면 server 레벨 add_header 가 상속되지 않으므로
    #       add_header 를 쓰는 location 에는 아래 3줄을 반복해서 넣는다.
    # CSP 는 Mantine 런타임 <style>, Kakao 우편번호 스크립트/iframe, jsdelivr 폰트 등을 사용하므로 적용하지 않음.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 해시가 붙은 빌드 산출물 (Vite /assets/*) → 장기 캐시
    location /assets/ {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        # always 없음: 404 등 오류 응답은 장기 캐시하지 않음
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 프론트엔드 (index.html / SPA 네비게이션 등) → 캐시 금지
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Cache-Control; # 프론트 컨테이너가 줄지도 모르는 기존 헤더 숨김
        proxy_hide_header Expires;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 로그인: 요청 속도 제한 (IP당 10r/m, burst 10, 초과 시 429)
    location = /api/login {
        limit_req zone=login_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # 백엔드 API 연결 (AI 분석은 수 분 걸릴 수 있어 긴 타임아웃 유지)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    900s;
        proxy_read_timeout    900s;
        send_timeout          900s;
    }

    # 비밀번호 관련 API
    location /passwordapi/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

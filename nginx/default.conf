# 로그인 무차별 대입 방지: IP당 분당 10회 (conf.d 파일은 http 컨텍스트에 include 됨)
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;

server {
    listen       80;
    server_name  _;

    # AI 발주서 업로드는 최대 30MB 허용 → 여유 포함 35MB (기본 1MB면 413 발생)
    client_max_body_size 35m;

    server_tokens off;

    # 압축 (프록시된 응답 포함)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain application/xml;

    # 보안 헤더
    # 주의: location 안에서 add_header 를 쓰면 server 레벨 add_header 가 상속되지 않으므로
    #       add_header 를 쓰는 location 에는 아래 3줄을 반복해서 넣는다.
    # CSP 는 Mantine 런타임 <style>, Kakao 우편번호 스크립트/iframe, jsdelivr 폰트 등을 사용하므로 적용하지 않음.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 해시가 붙은 빌드 산출물 (Vite /assets/*) → 장기 캐시
    location /assets/ {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        # always 없음: 404 등 오류 응답은 장기 캐시하지 않음
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 프론트엔드 (index.html / SPA 네비게이션 등) → 캐시 금지
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Cache-Control; # 프론트 컨테이너가 줄지도 모르는 기존 헤더 숨김
        proxy_hide_header Expires;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # CSP: 우리 서버 스크립트만 실행 (XSS 가 생겨도 외부 스크립트 주입 · 토큰 외부 전송을 막는다).
        #  - Kakao 우편번호(t1.kakaocdn.net → *.daumcdn.net 스크립트, *.daum.net / *.kakao.com 창)
        #  - Pretendard 글꼴(cdn.jsdelivr.net), Mantine 실행 시 <style> → style-src 'unsafe-inline'
        #  - PDF 미리보기 worker(blob:), 사업장 이미지(data:)
        # 외부 스크립트 · 글꼴을 새로 쓰면 여기에 주소를 추가해야 한다.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://t1.kakaocdn.net https://*.daumcdn.net https://*.kakaocdn.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; connect-src 'self'; frame-src 'self' https://*.daum.net https://*.kakao.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }

    # 로그인: 요청 속도 제한 (IP당 10r/m, burst 10, 초과 시 429)
    location = /api/login {
        limit_req zone=login_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # 백엔드 API 연결 (AI 분석은 수 분 걸릴 수 있어 긴 타임아웃 유지)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    900s;
        proxy_read_timeout    900s;
        send_timeout          900s;
    }

    # 비밀번호 관련 API: 로그인과 같은 속도 제한 (IP당 10r/m, burst 10, 초과 시 429)
    location /passwordapi/ {
        limit_req zone=login_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------------------------------------------------------------------------
# HTTPS 템플릿 (인증서 발급 후 사용 — 지금은 비활성)
# 사용 방법:
#   1) 인증서/키를 nginx 이미지(또는 볼륨)의 /etc/nginx/certs/ 에 둔다.
#   2) 아래 블록의 주석을 풀고, 위 80 server 블록의 location 들을 이 블록으로 옮긴다
#      (또는 위 80 블록은 HTTPS 로 리다이렉트만 하도록 바꾼다).
#   3) docker-compose.yml 의 nginx ports 에 "443:443" 을 추가한다.
#   4) HSTS 는 HTTPS 가 안정적으로 동작하는 것을 확인한 뒤 켠다 (브라우저가 max-age 동안 HTTP 접속을 거부).
#
# server {
#     listen 80;
#     server_name erp.example.com;
#     return 301 https://$host$request_uri;
# }
#
# server {
#     listen 443 ssl;
#     http2 on;
#     server_name erp.example.com;
#
#     ssl_certificate     /etc/nginx/certs/fullchain.pem;
#     ssl_certificate_key /etc/nginx/certs/privkey.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_prefer_server_ciphers off;
#     ssl_session_cache shared:SSL:10m;
#     ssl_session_timeout 1d;
#
#     client_max_body_size 35m;
#     server_tokens off;
#
#     # 처음에는 짧게(예: max-age=300) 시작해 문제없으면 1년(31536000)으로 늘린다.
#     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#     add_header X-Content-Type-Options "nosniff" always;
#     add_header X-Frame-Options "SAMEORIGIN" always;
#     add_header Referrer-Policy "strict-origin-when-cross-origin" always;
#     # 주의: location 안에서 add_header 를 쓰면 위 헤더가 상속되지 않으므로 HSTS 줄도 함께 반복한다.
#
#     # location /assets/, /, = /api/login, /api/, /passwordapi/ ... (위 80 블록과 동일하게)
# }

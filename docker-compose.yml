services:
  backend:
    image: mosco-backend:latest
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      RUNNING_IN_DOCKER: "1"
      # 운영 검증(DB 접속정보·JWT 키 필수, CORS '*' 금지)을 켜려면 배포 시 APP_ENV=production 으로 실행.
      # 전용 DB 계정(DB_HOST/DB_NAME/DB_USER/DB_PASSWORD)을 backend/.env에 넣은 뒤 production 으로 바꾼다.
      APP_ENV: ${APP_ENV:-development}
      # 프론트·API를 같은 도메인으로 서비스하면 비워 둔다. 다른 도메인에서 호출할 때만 쉼표로 나열.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"
    volumes:
      - ai_order_usage:/app/instance
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=4)"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  frontend:
    image: mosco-frontend:latest
    build:
      context: ./frontend
    expose:
      - "80"
    restart: unless-stopped

  nginx:
    image: mosco-proxy:latest
    build:
      context: ./nginx
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

volumes:
  ai_order_usage:

services:
  backend:
    image: mosco-backend:latest
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      RUNNING_IN_DOCKER: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"
    volumes:
      - ai_order_usage:/app/instance
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=4)"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  frontend:
    image: mosco-frontend:latest
    build:
      context: ./frontend
    expose:
      - "80"
    restart: unless-stopped

  nginx:
    image: mosco-proxy:latest
    build:
      context: ./nginx
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

volumes:
  ai_order_usage:

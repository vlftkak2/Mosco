version: "3.8"

services:
  # 백엔드 컨테이너 설정
  backend:
    image: hmchoia/aprportal-backend:latest
    build: ./backend
    container_name: backend
    volumes:
      - ./backend:/app # 내 컴퓨터의 코드를 컨테이너와 동기화
    ports:
      - "8000:8000"

  # 프론트엔드 컨테이너 설정
  frontend:
    image: hmchoia/aprportal-frontend:latest
    build: ./frontend
    container_name: frontend
    ports:
      - "5173:80"

  # Nginx 컨테이너 설정 (리버스 프록시)
  nginx:
    image: nginx:latest # 빌드 대신 순정 이미지 사용
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf # 위에서 수정한 파일을 주입
    depends_on:
      - backend
      - frontend

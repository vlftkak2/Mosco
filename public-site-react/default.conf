server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # 빌드 파일(이름에 해시가 붙음)은 오래 캐시
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    # /company, /erp 같은 주소로 바로 들어오거나 새로고침해도 React 가 처리하도록 index.html 을 돌려준다
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
